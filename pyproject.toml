# mu-sdk-python — the Product-B developer SDK: a THIN async wire client.
# No engine, no stores, no strategies, no embedder (CLAUDE.md; PACKAGING-v2 §4.2).
# Depends on `mu-contracts` (the shared wire vocabulary: Namespace/Visibility/error base) + `httpx`
# only — never `mu-engine`/`mu-local` (import-linter "sdk-has-no-engine", PACKAGING-v2 §5.1 rule 2).
[project]
name = "mu-sdk"
version = "0.1.0"
description = "Memory Universe — Python developer SDK (async wire client: add/search/recall/context)."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
readme = "README.md"
# No "License ::" trove classifier on purpose: PEP 639 replaced it with the `license` expression
# above, and declaring both is the deprecated form.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # Shared wire vocabulary ONLY (Namespace/Visibility/Tier + the error-hierarchy vocabulary).
    # The range is now WRITTEN, not a comment (OSS-GATE-0828): `[tool.uv.sources]` below is a
    # dev-only override that never reaches wheel metadata, so a bare `mu-contracts` shipped this
    # SDK with "any version, forever" as its only stated compatibility statement.
    "mu-contracts>=0.1.0,<0.2.0",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "tenacity>=9.0,<10",
]

# Open-source metadata (OSS-GATE-0828) — a published page with no link back to the source is not
# an open-source release.
[project.urls]
Homepage = "https://github.com/MemoryUniverse"
Repository = "https://github.com/MemoryUniverse/mu-sdk-python"
Issues = "https://github.com/MemoryUniverse/mu-sdk-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "mypy>=1.13,<2",
    "ruff>=0.8,<0.9",
    "import-linter>=2.1,<3",
    # Dev-only: the REAL conformance server the integration suite runs against (DEV-STANDARDS
    # "integration tests use the real system — zero mocks"). Never imported by mu_sdk itself.
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]
# Stage D (build-plan §5 D1, design §1.2/§9): `mode="embedded"` needs the engine IN-PROCESS.
# `mu_sdk.transport.EmbeddedTransport` imports `mu_local` LAZILY (inside __init__, never at module
# scope) so the DEFAULT install (no extra) still satisfies `sdk-has-no-engine` — grep-verified, see
# this task's own report. Installing this extra is the only way `mode="embedded"` becomes usable.
embedded = [
    "mu-local>=0.1.0,<0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mu_sdk"]

[tool.uv.sources]
# DEV-ONLY override; never reaches wheel metadata. Two stranger-visible consequences, both
# verified 2026-08-28 and both documented in README.md: (1) `git clone mu-sdk-python && uv sync`
# alone fails ("Distribution not found at: .../mu-core/packages/mu-contracts") — mu-core must be
# cloned as a SIBLING first; (2) uv honours this table even when this repo is consumed as a git
# URL and rewrites the path against the git remote, so the registry-free route is
# `uv pip install --no-sources` with explicit git URLs. See OSS-GATE-0828.md.
#
# Path dependency onto the sibling repo's mu-contracts distribution (PACKAGING-v2 §1.2: mu-sdk-python
# "may depend on... mu-contracts — only"). Absolute path: the two repos are siblings under mu_project/,
# not a uv workspace (mu-sdk-python is its own repo per the ratified 5-repo split, PACKAGING-v2 banner
# item 1) — so this is a directory dependency, not a workspace link.
# `editable = true` (CO-6): mu-local (below, `[embedded]` extra) is itself a member of the mu-core
# uv *workspace*, so uv resolves ITS mu-contracts dependency via the workspace's `{ workspace = true }`
# source — which uv always treats as editable. Left as a plain (non-editable) path dep here, this
# repo's own top-level `mu-contracts` dependency collides with that editable one: uv reports
# "conflicting URLs for package `mu-contracts`" (same path, different editable-ness) and refuses to
# resolve. Marking this source editable too makes both resolve to the SAME source, not a different
# dependency set — mu-contracts is still pulled from the same sibling checkout either way.
mu-contracts = { path = "../mu-core/packages/mu-contracts", editable = true }
# `[embedded]`-only path dep (Stage D, D1) — same sibling-repo-under-mu_project/ shape as
# mu-contracts above. mu-local's OWN pyproject.toml pulls in mu-engine transitively, so no separate
# entry is needed here for it. Also `editable = true` for the same CO-6 reason: mu-local is a
# mu-core workspace member, so anything that depends on it transitively (mu-engine, mu-contracts)
# is resolved editable; keep mu-local itself consistent rather than mixed.
mu-local = { path = "../mu-core/packages/mu-local", editable = true }

# ------------------------------------------------------------------------------------------------
# mypy — strict, CI gate (DEV-STANDARDS "strict static typing").
# ------------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tenacity.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------------------------------------
# pytest — asyncio auto mode + the two required markers (DEV-STANDARDS testing).
# ------------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "unit: isolated logic; mocks permitted (DEV-STANDARDS: mocks ONLY in pure unit tests).",
    "integration: real uvicorn conformance server, real httpx over real TCP, ZERO mocks.",
]
