# Ruff — lint + format, CI gate (DEV-STANDARDS "Ruff (lint) + ruff-format clean").
# Mirrors mu-core/ruff.toml's rule selection for cross-repo consistency (same reviewer eye).
target-version = "py312"
line-length = 100
src = ["src"]

[lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "ASYNC",     # flake8-async (cancellation/blocking-in-loop discipline)
    "S",         # bandit (security)
    "T20",       # flake8-print (DEV-STANDARDS: no print)
    "RUF",       # ruff-specific
    "ANN",       # missing annotations (strict typing bar)
    "TID",       # tidy-imports
]
ignore = [
    "ANN401",    # allow explicit Any where deliberately annotated
]

[lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]              # asserts + loose annotations OK in tests
"tests/conformance_server/**" = ["S101", "ANN", "B008"]  # FastAPI Depends(...) default-arg pattern

[lint.isort]
known-first-party = ["mu_sdk"]

[format]
docstring-code-format = true
